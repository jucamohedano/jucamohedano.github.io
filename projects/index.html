---
layout: default
title: Projects
---

<h1 class="page-title">projects</h1>

<p class="page-description">Write-ups of things I've built and worked on — research projects, thesis work, and internships.</p>

<ul class="post-list">
  {% for post in site.posts %}
    <li class="post-item">
      <h2 class="post-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      <p class="post-meta">{{ post.date | date: "%B %-d, %Y" }}</p>
      <div class="post-excerpt">
        {{ post.excerpt }}
      </div>
    </li>
  {% endfor %}
</ul>
