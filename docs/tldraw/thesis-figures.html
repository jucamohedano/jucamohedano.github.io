<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Thesis figures — tldraw generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://esm.sh/tldraw@3/tldraw.css">
<style>
html,body,#root{margin:0;height:100%}
#out{position:fixed;bottom:0;left:0;z-index:9999;background:#fff;font:11px monospace;white-space:pre-wrap}
.tl-container, :root {
  --tl-font-draw: "Red Hat Display", sans-serif;
  --tl-font-sans: "Red Hat Display", sans-serif;
  --tl-font-serif: "Red Hat Display", sans-serif;
  --tl-font-mono: "Red Hat Display", sans-serif;
}
.svgout{display:none}
</style>
</head>
<body>
<div id="root"></div>
<div id="out">BOOT</div>
<div id="fig1" class="svgout"></div>
<div id="fig2" class="svgout"></div>
<div id="fig3" class="svgout"></div>
<script type="module">
const out = document.getElementById('out');
const log = m => { out.textContent = String(m).slice(0, 700); };
const React = await import('https://esm.sh/react@18');
const ReactDOM = await import('https://esm.sh/react-dom@18/client');
const tl = await import('https://esm.sh/tldraw@3?deps=react@18,react-dom@18');
const { createShapeId, toRichText } = tl;
await document.fonts.load('700 48px "Red Hat Display"');
await document.fonts.load('400 16px "Red Hat Display"');
await document.fonts.ready;

// ── thesis data (chapter 7) ───────────────────────────────────────────────
const MODELS = [
  { name: '32B', p1: 0.327, p256: 0.758, audit: 0.512, under: 1.3, color: 'violet' },
  { name: '2B',  p1: 0.163, p256: 0.731, audit: 0.311, under: 7.9, color: 'red' },
  { name: '4B',  p1: 0.229, p256: 0.651, audit: 0.319, under: 6.2, color: 'grey' },
  { name: '8B',  p1: 0.244, p256: 0.611, audit: 0.334, under: 6.3, color: 'blue' },
];

let shapes = [], n = 0;
const reset = () => { shapes = []; };
const push = (s) => shapes.push({ id: createShapeId('s' + (n++)), ...s });
const text = (x, y, str, o = {}) => push({ type: 'text', x, y,
  props: { richText: toRichText(str), size: o.size || 'm', font: o.font || 'sans',
           color: o.color || 'black', textAlign: o.align || 'start',
           w: o.w || 400, autoSize: false } });
const box = (x, y, w, h, o = {}) => push({ type: 'geo', x, y,
  props: { w, h, geo: o.geo || 'rectangle', fill: o.fill || 'none', color: o.color || 'black',
           dash: o.dash || 'draw', size: o.size || 's' } });
const line = (x1, y1, x2, y2, o = {}) => push({ type: 'arrow', x: 0, y: 0,
  props: { start: { x: x1, y: y1 }, end: { x: x2, y: y2 }, bend: o.bend || 0,
           arrowheadStart: 'none', arrowheadEnd: o.head || 'none',
           color: o.color || 'black', size: o.size || 's', dash: o.dash || 'draw' } });

// ══ FIGURE 1 — the specificity problem ════════════════════════════════════
function figure1() {
  reset();
  text(60, 36, 'One picture, four correct answers', { size: 'xl', font: 'serif', w: 1100 });
  text(64, 106, 'A photo of a Golden Retriever. Every rung below is a defensible answer — standard accuracy picks one and marks the rest wrong.', { size: 's', color: 'grey', w: 1150 });

  const rungs = [
    ['animal', 'the broadest true answer', 'grey'],
    ['dog', 'still true, still vague', 'grey'],
    ['retriever', 'closer', 'blue'],
    ['Golden Retriever', 'the entity OVEN asks for', 'violet'],
  ];
  rungs.forEach((r, i) => {
    const x = 90 + i * 285, y = 210;
    box(x, y, 250, 158, { fill: i === 3 ? 'semi' : 'none', color: r[2], size: i === 3 ? 'm' : 's' });
    text(x + 20, y + 22, r[0], { size: 'l', color: r[2], w: 214 });
    text(x + 20, y + 112, r[1], { size: 's', color: 'grey', w: 210 });
    if (i < 3) line(x + 258, y + 79, x + 278, y + 79, { color: 'grey', head: 'arrow' });
  });
  text(90, 398, 'less specific', { size: 's', color: 'grey', w: 300 });
  text(1005, 398, 'more specific', { size: 's', color: 'grey', w: 300, align: 'end' });

  box(90, 458, 1160, 118, { fill: 'none', color: 'black', size: 's' });
  text(112, 480, 'So when a model answers "dog" for a Labrador, accuracy cannot tell us which failure it was:', { size: 'm', w: 1120 });
  text(112, 526, 'missing knowledge, or the right knowledge at the wrong level of detail.', { size: 'm', color: 'red', w: 1120 });
}

// ══ FIGURE 2 — coverage vs reliability ════════════════════════════════════
function figure2() {
  reset();
  text(60, 36, 'Models know more than they say', { size: 'xl', font: 'serif', w: 1100 });
  text(64, 106, 'Qwen3-VL on OVEN · 256 stochastic samples per image · the bar spans what the model says once to what it knows somewhere', { size: 's', color: 'grey', w: 1200 });

  const X0 = 300, X1 = 1120, sc = (v) => X0 + (v / 0.8) * (X1 - X0);
  // axis
  line(X0, 200, X1, 200, { color: 'grey', size: 's', dash: 'solid' });
  [0, 0.2, 0.4, 0.6, 0.8].forEach(t => text(sc(t) - 30, 158, t.toFixed(1), { size: 's', color: 'grey', w: 60, align: 'middle' }));

  const order = ['2B', '4B', '8B', '32B'];
  order.forEach((name, i) => {
    const m = MODELS.find(x => x.name === name);
    const y = 250 + i * 92;
    text(90, y - 4, m.name, { size: 'm', color: m.color, w: 110 });
    line(sc(m.p1), y + 12, sc(m.p256), y + 12, { color: m.color, size: 'm' });
    box(sc(m.p1) - 11, y + 1, 22, 22, { geo: 'ellipse', fill: 'solid', color: m.color, size: 's' });
    box(sc(m.p256) - 11, y + 1, 22, 22, { geo: 'ellipse', fill: 'none', color: m.color, size: 's' });
    text(sc(m.p1) - 62, y + 34, m.p1.toFixed(3), { size: 's', color: 'grey', w: 120, align: 'middle' });
    text(sc(m.p256) - 58, y + 34, m.p256.toFixed(3), { size: 's', color: 'grey', w: 120, align: 'middle' });
  });
  text(sc(0.163) - 70, 228, 'says once', { size: 's', color: 'grey', w: 140, align: 'middle' });
  text(sc(0.731) - 70, 228, 'knows somewhere', { size: 's', color: 'grey', w: 190, align: 'middle' });

  box(90, 626, 1160, 110, { fill: 'none', size: 's' });
  text(112, 648, 'The 2B model reaches the right entity in 73% of images but leads with it in only 16%.', { size: 'm', w: 1120 });
  text(112, 692, 'A single-attempt score would call that a 16% model.', { size: 's', color: 'grey', w: 1120 });
}

// ══ FIGURE 3 — the ranking flip ═══════════════════════════════════════════
function figure3() {
  reset();
  const byLenient = [...MODELS].sort((a, b) => b.p256 - a.p256);
  const byStrict  = [...MODELS].sort((a, b) => b.audit - a.audit);
  const LX = 470, RX = 900, ROW0 = 300, ROWH = 82;

  text(60, 36, 'The judge decides the ranking', { size: 'xl', font: 'serif', w: 1100 });
  text(64, 106, 'Same models, same images, same samples — only the definition of "correct" changes.', { size: 's', color: 'grey', w: 1150 });

  text(180, 214, 'Lenient judge', { size: 'm', font: 'serif', w: 260 });
  text(180, 246, 'pass@256', { size: 's', color: 'grey', w: 260 });
  text(RX + 70, 214, 'Specificity audit', { size: 'm', font: 'serif', w: 300 });
  text(RX + 70, 246, 'supported pass@256', { size: 's', color: 'grey', w: 300 });

  const yOf = (arr, name) => ROW0 + arr.findIndex(m => m.name === name) * ROWH;
  MODELS.forEach((m) => {
    const y1 = yOf(byLenient, m.name), y2 = yOf(byStrict, m.name);
    const thick = (m.name === '2B' || m.name === '8B');
    line(LX, y1 + 16, RX, y2 + 16, { color: m.color, size: thick ? 'm' : 's' });
    text(180, y1, m.name, { size: 'm', color: m.color, w: 90 });
    text(285, y1 + 3, m.p256.toFixed(3), { size: 's', color: 'grey', w: 120 });
    text(RX + 70, y2, m.name, { size: 'm', color: m.color, w: 90 });
    text(RX + 175, y2 + 3, m.audit.toFixed(3), { size: 's', color: 'grey', w: 120 });
  });

  box(180, ROW0 + 4 * ROWH + 10, 1070, 112, { fill: 'none', size: 's' });
  text(202, ROW0 + 4 * ROWH + 32, '2B looks broadest under the judge and lands last under the audit.', { size: 'm', w: 1030 });
  text(202, ROW0 + 4 * ROWH + 76, 'Under-specific answers: 7.9% of its accepted rollouts, against 1.3% for 32B.', { size: 's', color: 'grey', w: 1030 });
}

const FIGS = [['fig1', figure1], ['fig2', figure2], ['fig3', figure3]];

function App() {
  return React.createElement(tl.Tldraw, {
    onMount: async (editor) => {
      const report = [];
      for (const [slot, build] of FIGS) {
        try {
          editor.selectAll();
          editor.deleteShapes(editor.getSelectedShapeIds());
          build();
          for (const s of shapes) editor.createShapes([s]);
          const ids = Array.from(editor.getCurrentPageShapeIds());
          const r = await editor.getSvgString(ids, { background: true, padding: 40, scale: 1 });
          document.getElementById(slot).textContent = r.svg;
          report.push(slot + '=' + ids.length + 'sh/' + Math.round(r.svg.length / 1024) + 'kb');
        } catch (e) { report.push(slot + '_ERR:' + e.message.slice(0, 80)); }
      }
      window.__done = true;
      log(report.join(' | '));
    },
  });
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
