<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://esm.sh/tldraw@3/tldraw.css">
<style>html,body,#root{margin:0;height:100%}#out{position:fixed;bottom:0;left:0;z-index:9999;background:#fff;font:11px monospace;white-space:pre-wrap}#svgout{display:none}</style>
</head>
<body>
<div id="root"></div>
<div id="out">BOOT</div>
<div id="svgout"></div>
<script type="module">
const out = document.getElementById('out');
const log = m => { out.textContent = String(m).slice(0, 700); };
const React = await import('https://esm.sh/react@18');
const ReactDOM = await import('https://esm.sh/react-dom@18/client');
const tl = await import('https://esm.sh/tldraw@3?deps=react@18,react-dom@18');
const { createShapeId, toRichText } = tl;

// ── the data (thesis ch.7) ────────────────────────────────────────────────
// left = lenient judge pass@256, right = specificity-audited pass@256
const MODELS = [
  { name: '32B', lenient: 0.758, strict: 0.512, color: 'violet' },
  { name: '2B',  lenient: 0.731, strict: 0.311, color: 'red' },
  { name: '4B',  lenient: 0.651, strict: 0.319, color: 'grey' },
  { name: '8B',  lenient: 0.611, strict: 0.334, color: 'blue' },
];
const byLenient = [...MODELS].sort((a, b) => b.lenient - a.lenient);
const byStrict  = [...MODELS].sort((a, b) => b.strict  - a.strict);

const LX = 470, RX = 900, ROW0 = 380, ROWH = 82;
const shapes = [];
const errs = [];
let n = 0;
const push = (s) => shapes.push({ id: createShapeId('s' + (n++)), ...s });
const text = (x, y, str, o = {}) => push({ type: 'text', x, y,
  props: { richText: toRichText(str), size: o.size || 'm', font: o.font || 'sans',
           color: o.color || 'black', textAlign: o.align || 'start',
           w: o.w || 400, autoSize: false } });
const box = (x, y, w, h, o = {}) => push({ type: 'geo', x, y,
  props: { w, h, geo: 'rectangle', fill: o.fill || 'none', color: o.color || 'black',
           dash: o.dash || 'draw', size: o.size || 's' } });
const line = (x1, y1, x2, y2, o = {}) => push({ type: 'arrow', x: 0, y: 0,
  props: { start: { x: x1, y: y1 }, end: { x: x2, y: y2 }, bend: o.bend || 0,
           arrowheadStart: 'none', arrowheadEnd: 'none',
           color: o.color || 'black', size: o.size || 's', dash: o.dash || 'draw' } });

// ── header ────────────────────────────────────────────────────────────────
text(60, 36, 'The judge decides the ranking', { size: 'xl', font: 'serif', w: 1000 });
text(64, 106, 'Qwen3-VL on OVEN  ·  pass@256  ·  same models, same images, two notions of correct', { size: 's', color: 'grey', w: 1000 });

// ── stat tiles ────────────────────────────────────────────────────────────
const tiles = [
  ['0.163', 'pass@1 · 2B · reliability'],
  ['0.731', 'pass@256 · 2B · coverage'],
  ['4.5x', 'knows / says · the gap'],
];
tiles.forEach((t, i) => {
  const x = 60 + i * 330;
  box(x, 158, 300, 108, { fill: 'none', size: 's' });
  text(x + 20, 172, t[0], { size: 'xl', font: 'mono', w: 260 });
  text(x + 20, 232, t[1], { size: 's', color: 'grey', w: 270 });
});

// ── slopegraph ────────────────────────────────────────────────────────────
text(180, 314, 'Lenient judge', { size: 'm', font: 'serif', w: 260 });
text(RX + 70, 314, 'Specificity audit', { size: 'm', font: 'serif', w: 300 });

const yOf = (arr, name) => ROW0 + arr.findIndex(m => m.name === name) * ROWH;
MODELS.forEach((m) => {
  const y1 = yOf(byLenient, m.name), y2 = yOf(byStrict, m.name);
  const thick = (m.name === '2B' || m.name === '8B');
  line(LX, y1 + 16, RX, y2 + 16, { color: m.color, size: thick ? 'm' : 's' });
  text(180, y1, m.name, { size: 'm', font: 'mono', color: m.color, w: 90 });
  text(285, y1 + 3, m.lenient.toFixed(3), { size: 's', font: 'mono', color: 'grey', w: 120 });
  text(RX + 70, y2, m.name, { size: 'm', font: 'mono', color: m.color, w: 90 });
  text(RX + 175, y2 + 3, m.strict.toFixed(3), { size: 's', font: 'mono', color: 'grey', w: 120 });
});

// ── annotation ────────────────────────────────────────────────────────────
text(180, ROW0 + 4 * ROWH + 24, '2B looks broadest under the judge and lands last under the audit.', { size: 's', w: 900 });
text(180, ROW0 + 4 * ROWH + 56, 'Under-specific answers: 7.9% of its accepted rollouts, against 1.3% for 32B.', { size: 's', color: 'grey', w: 900 });

function App() {
  return React.createElement(tl.Tldraw, {
    onMount: async (editor) => {
      for (const s of shapes) {
        try { editor.createShapes([s]); }
        catch (e) { errs.push(s.type + ':' + e.message.slice(0, 70)); }
      }
      try {
        const ids = Array.from(editor.getCurrentPageShapeIds());
        const r = await editor.getSvgString(ids, { background: true, padding: 40, scale: 1 });
        document.getElementById("svgout").textContent = r.svg;
        window.__done = true;
        log('SHAPES=' + ids.length + ' SVG=' + r.svg.length + ' ERRS=' + (errs.length ? errs.join(' | ') : 'none'));
      } catch (e) { log('EXPORT_ERR ' + e.message + ' ERRS=' + errs.join(' | ')); }
    },
  });
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
